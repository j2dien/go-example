version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: go_crud_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: go_crud_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: go_crud_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SERVER_MODE: release
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: go_crud_db
      JWT_SECRET: production-secret-key-please-change-12345
      JWT_ACCESS_EXPIRY: 15
      JWT_REFRESH_EXPIRY: 168
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: go_crud_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
